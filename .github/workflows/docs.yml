name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deploy; queued runs are skipped (latest wins).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The showcase imports `@kinem/core` via path alias to source, but
      # the docs build (typedoc) reads the published .d.ts files, so the
      # packages need a real build first.
      - name: Build packages
        run: pnpm -r --filter "./packages/**" run build

      - name: Build docs (with showcase)
        env:
          DOCS_BASE: /kinem/
        run: pnpm -C docs build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
